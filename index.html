<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>開票直播牆</title>
<meta name="theme-color" content="#0b0b0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="開票直播牆">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: #0b0b0b; color: #e8e8e8; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  body { padding: calc(4px + env(safe-area-inset-top)) calc(4px + env(safe-area-inset-right))
           calc(4px + env(safe-area-inset-bottom)) calc(4px + env(safe-area-inset-left)); }

  /* ===== 影片牆 ===== */
  .wall { display: grid; gap: 4px; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); align-content: start; }
  .tile { background: #000; min-width: 0; }
  .video { position: relative; aspect-ratio: 16 / 9; background: #1a1a1a; overflow: hidden; }
  .video .player, .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  /* 透明玻璃：攔截點擊，避免被 YouTube 吃掉 */
  .glass { position: absolute; inset: 0; z-index: 2; cursor: pointer; touch-action: manipulation; }
  .tile.live .glass { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1); }
  body.direct .glass { display: none; }
  .msg { position: absolute; inset: 0; z-index: 1; display: none; align-items: center; justify-content: center;
    text-align: center; padding: 12px; font-size: 12px; line-height: 1.6; color: #999; }
  .tile.err .msg { display: flex; }
  .label { display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 3px 6px 6px; background: #000; font-size: 12px; color: #ccc; min-height: 24px; }
  .label .name { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .tools { display: none; gap: 2px; flex-shrink: 0; }
  body.editing .tools { display: flex; }
  .tools button { background: none; border: 0; color: #999; font-size: 15px; width: 30px; height: 26px;
    padding: 0; cursor: pointer; border-radius: 4px; }
  .tools button:active { background: #222; }

  /* 單台放大 */
  .wall.solo { grid-template-columns: 1fr; }
  .wall.solo .tile:not(.solo) { display: none; }
  .wall.solo .tile.solo { justify-self: center;
    width: min(100%, calc((100dvh - 40px - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 16 / 9)); }

  /* 空狀態 */
  .empty { display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    min-height: 70vh; color: #888; font-size: 14px; text-align: center; }
  body.is-empty .empty { display: flex; }

  /* ===== 右下角按鈕 ===== */
  .fab { position: fixed; right: calc(14px + env(safe-area-inset-right)); bottom: calc(14px + env(safe-area-inset-bottom));
    z-index: 10; width: 38px; height: 38px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, 0.12);
    color: #ddd; font-size: 20px; line-height: 1; cursor: pointer; letter-spacing: 1px; }

  /* ===== 面板與對話框 ===== */
  .backdrop { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, 0.5); display: none; }
  .backdrop.show { display: block; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; margin: 0 auto; max-width: 480px;
    background: #1c1c1c; border-radius: 16px 16px 0 0; padding: 8px 18px calc(16px + env(safe-area-inset-bottom));
    transform: translateY(105%); transition: transform 0.2s ease; }
  .sheet.show { transform: none; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 13px 0;
    font-size: 14px; border-bottom: 0.5px solid #2e2e2e; }
  .row.click { cursor: pointer; }
  .stepper { display: flex; align-items: center; border: 0.5px solid #555; border-radius: 8px; overflow: hidden; }
  .stepper button { background: none; border: 0; color: #ddd; width: 38px; height: 32px; font-size: 18px; cursor: pointer; padding: 0; }
  .stepper button:active { background: #2e2e2e; }
  .stepper button.dim { color: #555; }
  .stepper span { min-width: 36px; text-align: center; font-size: 15px; line-height: 32px;
    border-left: 0.5px solid #444; border-right: 0.5px solid #444; }
  .switch { width: 40px; height: 24px; border-radius: 12px; background: #444; position: relative; border: 0; cursor: pointer; padding: 0; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%;
    background: #ddd; transition: left 0.15s; }
  body.direct #directSwitch { background: #8a8a8a; }
  body.direct #directSwitch::after { left: 18px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px 0; border-bottom: 0.5px solid #2e2e2e; }
  .pair button { height: 40px; border-radius: 8px; border: 0.5px solid #444; background: #262626; color: #ddd;
    font-size: 14px; cursor: pointer; padding: 0 6px; }
  .pair button:active { background: #333; }
  body.editing #editSwitch { background: #eee; color: #111; border-color: #eee; }
  .close { display: block; width: 100%; background: none; border: 0; color: #888; font-size: 13px; padding: 12px 0 2px; cursor: pointer; }

  .dialog { position: fixed; z-index: 31; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(92vw, 420px); background: #1c1c1c; border-radius: 14px; padding: 18px; display: none; }
  .dialog.show { display: block; }
  .dialog h2 { margin: 0 0 14px; font-size: 16px; font-weight: 500; }
  .dialog label { display: block; font-size: 12px; color: #999; margin: 10px 0 5px; }
  .dialog input { width: 100%; height: 40px; border-radius: 8px; border: 0.5px solid #444; background: #111;
    color: #eee; padding: 0 10px; font-size: 16px; }
  .dialog input:focus { outline: none; border-color: #888; }
  .hint { font-size: 11px; color: #777; margin-top: 5px; line-height: 1.5; }
  .error { font-size: 12px; color: #f08080; margin-top: 8px; min-height: 1em; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .btn { height: 36px; padding: 0 16px; border-radius: 8px; border: 0.5px solid #555; background: none;
    color: #ddd; font-size: 14px; cursor: pointer; }
  .btn.primary { background: #eee; color: #111; border-color: #eee; }
</style>
</head>
<body>

<div class="wall" id="wall"></div>

<div class="empty">
  <div>還沒有電視台，先新增一台吧</div>
  <button class="btn primary" id="emptyAdd">新增電視台</button>
</div>

<button class="fab" id="fab" aria-label="設定">⋯</button>

<div class="backdrop" id="backdrop"></div>

<div class="sheet" id="sheet">
  <div class="pair">
    <button id="muteAll">靜音</button>
    <button id="allLive">更新直播進度</button>
  </div>
  <div class="row">
    <span>一列幾格</span>
    <div class="stepper">
      <button id="colsMinus" aria-label="減少">−</button><span id="colsNum">2</span><button id="colsPlus" aria-label="增加">＋</button>
    </div>
  </div>
  <div class="pair">
    <button id="sheetAdd">新增頻道</button>
    <button id="editSwitch">編輯模式</button>
  </div>
  <div class="row" style="border:none"><span>直接操作 YouTube<br><span style="font-size:11px;color:#777">可按略過廣告，點畫面暫時不會換台</span></span><button class="switch" id="directSwitch" aria-label="直接操作 YouTube"></button></div>
  <button class="close" id="sheetClose">關閉</button>
</div>

<div class="dialog" id="dialog">
  <h2 id="dlgTitle">新增電視台</h2>
  <label for="inName">電視台名稱</label>
  <input id="inName" placeholder="三立新聞" autocomplete="off">
  <label for="inUrl">YouTube 直播網址</label>
  <input id="inUrl" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off" inputmode="url">
  <div class="hint">影片網址、youtu.be 短網址、/live/ 網址都可以；也可以貼 /channel/UC… 頻道網址，會自動抓那台正在直播的畫面。</div>
  <div class="error" id="dlgErr"></div>
  <div class="actions">
    <button class="btn" id="dlgCancel">取消</button>
    <button class="btn primary" id="dlgOk">加入</button>
  </div>
</div>

<script>
/* ========== 資料存取 ========== */
const KEY = 'electionWall.v2';
const COLS_MIN = 1, COLS_MAX = 10;

/* 預設電視台：沒手動改過網址的台，每次打開都會用這裡的最新網址 */
const DEFAULTS = [
  { id: 'd-set',  name: '三立新聞', src: 'https://www.youtube.com/live/yeYC0mbSIOo?si=p1N4dMdxi2sfol_X' },
  { id: 'd-mnews', name: '鏡新聞',  src: 'https://www.youtube.com/watch?v=5n0y6b0Q25o' },
  { id: 'd-ftv',  name: '民視新聞', src: 'https://www.youtube.com/watch?v=ylYJSBUgaMA' },
  { id: 'd-cts',  name: '華視新聞', src: 'https://www.youtube.com/watch?v=wM0g8EoUZ_E' },
  { id: 'd-ebc',  name: '東森新聞', src: 'https://www.youtube.com/watch?v=V1p33hqPrUk' },
  { id: 'd-tvbs', name: 'TVBS',    src: 'https://www.youtube.com/watch?v=m_dhMSvUCIc' },
  { id: 'd-ctitv', name: '寰宇新聞', src: 'https://www.youtube.com/watch?v=6IquAgfvYmc' },
  { id: 'd-ctv',  name: '中視新聞', src: 'https://www.youtube.com/watch?v=TCnaIE_SAtM' },
  { id: 'd-cti',  name: '中天新聞', src: 'https://www.youtube.com/watch?v=vr3XyVCR4T0' }
];
const DEFAULT_MAP = Object.fromEntries(DEFAULTS.map(d => [d.id, d]));
const FIRST_SIX = ['d-set', 'd-mnews', 'd-ftv', 'd-cts', 'd-ebc', 'd-tvbs'];

let state = { cols: 2, items: DEFAULTS.map(d => ({ ...d })), seen: DEFAULTS.map(d => d.id) };
try {
  const saved = JSON.parse(localStorage.getItem(KEY));
  if (saved && Array.isArray(saved.items)) {
    saved.items.forEach(it => { if (DEFAULT_MAP[it.id] && !it.custom) it.src = DEFAULT_MAP[it.id].src; });
    // seen = 曾經出現過的預設台；之後新增的預設台會自動補在最後，被你刪掉的不會再跑回來
    const seen = new Set(Array.isArray(saved.seen) ? saved.seen : FIRST_SIX);
    DEFAULTS.forEach(d => { if (!seen.has(d.id)) { saved.items.push({ ...d }); seen.add(d.id); } });
    state = { cols: saved.cols || 2, items: saved.items, seen: [...seen] };
  }
} catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
save();

/* ========== 解析 YouTube 網址 ========== */
function parseYT(input) {
  const s = (input || '').trim();
  if (!s) return null;
  if (/^UC[\w-]{22}$/.test(s)) return { channel: s };
  if (/^[\w-]{11}$/.test(s)) return { id: s };
  let u;
  try { u = new URL(/^https?:\/\//i.test(s) ? s : 'https://' + s); } catch (e) { return null; }
  const host = u.hostname.replace(/^(www|m|music)\./, '');
  if (host === 'youtu.be') {
    const id = u.pathname.slice(1).split('/')[0];
    return /^[\w-]{11}$/.test(id) ? { id } : null;
  }
  if (host === 'youtube.com' || host === 'youtube-nocookie.com') {
    const v = u.searchParams.get('v');
    if (v && /^[\w-]{11}$/.test(v)) return { id: v };
    let m = u.pathname.match(/^\/(?:live|embed|shorts|v)\/([\w-]{11})(?:$|\/)/);
    if (m && m[1] !== 'live_stream') return { id: m[1] };
    m = u.pathname.match(/^\/channel\/(UC[\w-]{22})/);
    if (m) return { channel: m[1] };
    const ch = u.searchParams.get('channel');
    if (ch && /^UC[\w-]{22}$/.test(ch)) return { channel: ch };
    if (/^\/@/.test(u.pathname)) return { handle: true };
  }
  return null;
}

/* ========== YouTube 播放器 ========== */
let apiReady = false;
const pending = [];
window.onYouTubeIframeAPIReady = () => { apiReady = true; pending.splice(0).forEach(fn => fn()); };
(function () {
  const t = document.createElement('script');
  t.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(t);
})();

const ERR_TEXT = {
  2: '網址格式不對，請按編輯重新貼上',
  5: '這支影片無法在網頁上播放',
  100: '找不到影片，可能直播已結束或被移除，請按編輯換新網址',
  101: '這台不允許嵌入到其他網站播放',
  150: '這台不允許嵌入到其他網站播放',
  153: '播放器設定錯誤，請確認是用網址開啟這個網頁'
};

const tiles = new Map(); // id -> { el, player, src }
let liveId = null; // null = 全部靜音（一打開預設）
let soloId = null;

function buildPlayer(t, item) {
  const host = t.el.querySelector('.video');
  const old = host.querySelector('.player, iframe');
  if (old) old.remove();
  if (t.player && t.player.destroy) { try { t.player.destroy(); } catch (e) {} }
  t.player = null;
  t.jumped = false;
  t.el.classList.remove('err');
  t.src = item.src;

  const target = document.createElement('div');
  target.className = 'player';
  host.insertBefore(target, host.firstChild);

  const p = parseYT(item.src);
  if (!p || p.handle) {
    showErr(t, p && p.handle ? '@ 帳號網址抓不到直播，請貼直播影片網址或 /channel/UC… 網址' : '網址看不懂，請按編輯重新貼上');
    return;
  }
  const make = () => {
    const vars = { autoplay: 1, mute: 1, playsinline: 1, controls: 0, rel: 0, iv_load_policy: 3, disablekb: 1, fs: 0 };
    const opts = { width: '100%', height: '100%', playerVars: vars, events: {
      onReady: e => { e.target.mute(); e.target.playVideo(); if (liveId === item.id) unmuteOnly(item.id); },
      // 第一次開始播放時，自動跳到直播最前端（避免從 YouTube 記住的舊位置開始播）
      onStateChange: e => {
        if (e.data === 1 && !t.jumped) { t.jumped = true; setTimeout(() => goLive(e.target), 600); }
      },
      onError: e => showErr(t, ERR_TEXT[e.data] || '播放出錯了（代碼 ' + e.data + '）')
    }};
    if (p.channel) { opts.videoId = 'live_stream'; vars.channel = p.channel; }
    else opts.videoId = p.id;
    t.player = new YT.Player(target, opts);
  };
  apiReady ? make() : pending.push(make);
}

/* 跳到直播最前端：直播的總長度會一直增加，跳到「總長度」的位置就是現在 */
function goLive(pl) {
  try {
    const data = pl.getVideoData && pl.getVideoData();
    if (data && data.isLive === false) return; // 確定不是直播就不跳，免得重播影片被跳到結尾
    const d = pl.getDuration();
    if (d > 0) { pl.seekTo(d, true); pl.playVideo(); }
  } catch (e) {}
}

function showErr(t, text) {
  t.el.classList.add('err');
  t.el.querySelector('.msg').textContent = text;
}

/* ========== 聲音：一次只聽一台 ========== */
function unmuteOnly(id) {
  liveId = id;
  tiles.forEach((t, tid) => {
    t.el.classList.toggle('live', tid === id);
    const pl = t.player;
    if (!pl || !pl.mute) return;
    try {
      if (tid === id) { pl.unMute(); pl.setVolume(100); pl.playVideo(); }
      else pl.mute();
    } catch (e) {}
  });
}

/* ========== 單台放大 ========== */
function toggleSolo(id) {
  soloId = soloId === id ? null : id;
  const wall = document.getElementById('wall');
  wall.classList.toggle('solo', !!soloId);
  tiles.forEach((t, tid) => t.el.classList.toggle('solo', tid === soloId));
  window.scrollTo(0, 0);
}

/* ========== 畫面同步 ========== */
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function createTile(item) {
  const el = document.createElement('div');
  el.className = 'tile';
  el.innerHTML =
    '<div class="video"><div class="msg"></div><div class="glass"></div></div>' +
    '<div class="label"><span class="name"></span><span class="tools">' +
    '<button data-act="edit" aria-label="編輯">✎</button>' +
    '<button data-act="up" aria-label="往前">↑</button>' +
    '<button data-act="down" aria-label="往後">↓</button>' +
    '<button data-act="del" aria-label="刪除">✕</button></span></div>';

  let lastTap = 0;
  el.querySelector('.glass').addEventListener('click', () => {
    const now = Date.now();
    if (now - lastTap < 320) { toggleSolo(item.id); lastTap = 0; }
    else { unmuteOnly(item.id); lastTap = now; }
  });
  el.querySelector('.tools').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    const i = state.items.findIndex(x => x.id === item.id);
    if (i < 0) return;
    const act = b.dataset.act;
    if (act === 'edit') openDialog(state.items[i]);
    else if (act === 'del') { state.items.splice(i, 1); if (liveId === item.id) liveId = null; if (soloId === item.id) toggleSolo(item.id); }
    else if (act === 'up' && i > 0) [state.items[i - 1], state.items[i]] = [state.items[i], state.items[i - 1]];
    else if (act === 'down' && i < state.items.length - 1) [state.items[i + 1], state.items[i]] = [state.items[i], state.items[i + 1]];
    save(); render();
  });

  document.getElementById('wall').appendChild(el);
  const t = { el, player: null, src: null };
  tiles.set(item.id, t);
  return t;
}

function render() {
  const wall = document.getElementById('wall');
  wall.style.setProperty('--cols', state.cols);
  document.getElementById('colsNum').textContent = state.cols;
  document.getElementById('colsMinus').classList.toggle('dim', state.cols <= COLS_MIN);
  document.getElementById('colsPlus').classList.toggle('dim', state.cols >= COLS_MAX);
  document.body.classList.toggle('is-empty', state.items.length === 0);

  const ids = new Set(state.items.map(x => x.id));
  tiles.forEach((t, id) => {
    if (!ids.has(id)) {
      if (t.player && t.player.destroy) { try { t.player.destroy(); } catch (e) {} }
      t.el.remove(); tiles.delete(id);
    }
  });
  // 用 CSS order 排序，不搬動 DOM，影片才不會重新載入
  state.items.forEach((item, idx) => {
    const t = tiles.get(item.id) || createTile(item);
    t.el.style.order = idx;
    t.el.querySelector('.name').textContent = item.name;
    if (t.src !== item.src) buildPlayer(t, item);
  });
  tiles.forEach((t, id) => t.el.classList.toggle('live', id === liveId));
}

/* ========== 設定面板 ========== */
const sheet = document.getElementById('sheet');
const dialog = document.getElementById('dialog');
const backdrop = document.getElementById('backdrop');
function openSheet() { sheet.classList.add('show'); backdrop.classList.add('show'); }
function closeAll() {
  sheet.classList.remove('show'); dialog.classList.remove('show'); backdrop.classList.remove('show');
  document.activeElement && document.activeElement.blur();
}
document.getElementById('fab').onclick = openSheet;
document.getElementById('sheetClose').onclick = closeAll;
backdrop.onclick = closeAll;
document.getElementById('colsMinus').onclick = () => { if (state.cols > COLS_MIN) { state.cols--; save(); render(); } };
document.getElementById('colsPlus').onclick = () => { if (state.cols < COLS_MAX) { state.cols++; save(); render(); } };
document.getElementById('editSwitch').onclick = () => document.body.classList.toggle('editing');
document.getElementById('directSwitch').onclick = () => document.body.classList.toggle('direct');
document.getElementById('muteAll').onclick = () => { unmuteOnly(null); closeAll(); };
document.getElementById('allLive').onclick = () => { tiles.forEach(t => t.player && goLive(t.player)); closeAll(); };
document.getElementById('sheetAdd').onclick = () => openDialog(null);
document.getElementById('emptyAdd').onclick = () => openDialog(null);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAll(); });

/* ========== 新增 / 編輯 對話框 ========== */
let editing = null;
const inName = document.getElementById('inName');
const inUrl = document.getElementById('inUrl');
const dlgErr = document.getElementById('dlgErr');
function openDialog(item) {
  editing = item;
  sheet.classList.remove('show');
  backdrop.classList.add('show');
  document.getElementById('dlgTitle').textContent = item ? '編輯電視台' : '新增電視台';
  document.getElementById('dlgOk').textContent = item ? '儲存' : '加入';
  inName.value = item ? item.name : '';
  inUrl.value = item ? item.src : '';
  dlgErr.textContent = '';
  dialog.classList.add('show');
  setTimeout(() => (item ? inUrl : inName).focus(), 50);
}
[inName, inUrl].forEach(el => el.addEventListener('input', () => (dlgErr.textContent = '')));
document.getElementById('dlgCancel').onclick = closeAll;
document.getElementById('dlgOk').onclick = submit;
[inName, inUrl].forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); }));
function submit() {
  const name = inName.value.trim();
  const src = inUrl.value.trim();
  if (!name) { dlgErr.textContent = '請輸入電視台名稱'; inName.focus(); return; }
  if (!src) { dlgErr.textContent = '請貼上 YouTube 網址'; inUrl.focus(); return; }
  const p = parseYT(src);
  if (!p) { dlgErr.textContent = '這不像 YouTube 網址，再確認一下'; inUrl.focus(); return; }
  if (p.handle) { dlgErr.textContent = '@ 帳號網址抓不到直播，請改貼直播影片的網址'; inUrl.focus(); return; }
  if (editing) { if (editing.src !== src) editing.custom = true; editing.name = name; editing.src = src; }
  else state.items.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name, src });
  save(); closeAll(); render();
}

render();
</script>
</body>
</html>
